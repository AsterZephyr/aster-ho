[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ho-sdk"
version = "0.1.0"
description = "Observability SDK for AI agents — Python edition"
readme = {text = "Observability SDK for AI agents", content-type = "text/plain"}
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "AsterZephyr" },
]
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
all = ["openai>=1.0.0", "anthropic>=0.20.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ho_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
