version: "3.8"

services:
  ho:
    image: node:20-slim
    working_dir: /app
    command: ["npx", "ho", "serve"]
    ports:
      - "3000:3000"
    environment:
      - HO_PROMETHEUS_ENABLED=true
      - HO_PROMETHEUS_PORT=9464
    expose:
      - "9464"
    networks:
      - ho-net

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - ho-net
    depends_on:
      - ho

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./provisioning.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./:/var/lib/grafana/dashboards/ho:ro
      - ./dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/ho.yaml:ro
      - grafana-data:/var/lib/grafana
    networks:
      - ho-net
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  ho-net:
    driver: bridge
